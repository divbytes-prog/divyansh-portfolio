name: MoodTrip model retraining

on:
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v6

      - name: Check feedback storage secrets
        id: storage
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Supabase secrets are not configured; skipping real-data retraining."
          fi

      - uses: actions/setup-python@v6
        if: steps.storage.outputs.enabled == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install ML dependencies
        if: steps.storage.outputs.enabled == 'true'
        run: pip install -r ml/requirements.txt

      - name: Retrain with real interactions
        if: steps.storage.outputs.enabled == 'true'
        run: python ml/train_moodtrip.py

      - uses: actions/setup-node@v6
        if: steps.storage.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Verify regenerated model
        if: steps.storage.outputs.enabled == 'true'
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Commit updated model artifact
        if: steps.storage.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ml/model_artifacts.json
          git diff --cached --quiet || git commit -m "Retrain MoodTrip model from interaction data"
          git push
